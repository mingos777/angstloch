<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Angstloch playground: steps</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>Angstloch playground</h1>
    <nav>
      <a href="./index.html">Index</a><a href="./steps.html">Steps</a
      ><a href="./noise.html">Noise</a>
    </nav>
    <form id="controls">
      <label
        >Width <input name="width" type="number" value="80" min="3"
      /></label>
      <label
        >Height <input name="height" type="number" value="50" min="3"
      /></label>
      <label>Seed <input name="seed" type="number" value="1" /></label>
      <label
        >Tile size <input name="tileSize" type="number" value="12" min="1"
      /></label>
      <label
        >Base tile
        <select name="baseTile">
          <option value="3">grass</option>
          <option value="0">wall</option>
          <option value="1">floor</option>
        </select>
      </label>
      <label
        >Attempts <input name="attempts" type="number" value="3" min="1"
      /></label>
    </form>
    <details id="presets" open>
      <summary>Presets</summary>
      <div class="buttons">
        <button id="load-forest" type="button">Forest</button>
        <button id="load-cave" type="button">Cave</button>
        <button id="load-noise-cave" type="button">Noise cave</button>
        <button id="load-cave-rooms" type="button">Cave with rooms</button>
        <button id="load-mine" type="button">Mine</button>
        <button id="load-mine-caverns" type="button">Mine with caverns</button>
        <button id="load-maze" type="button">Maze</button>
        <button id="load-maze-rooms" type="button">Maze with rooms</button>
        <button id="load-dungeon" type="button">Dungeon</button>
        <button id="load-grown-dungeon" type="button">Grown dungeon</button>
        <button id="load-dungeon-features" type="button">
          Dungeon with a hall and a cavern
        </button>
        <button id="load-prison" type="button">Prison</button>
        <button id="load-lattice-prison" type="button">Lattice prison</button>
        <button id="load-sewer" type="button">Sewer</button>
        <button id="load-sewer-cisterns" type="button">
          Sewer with cisterns
        </button>
        <button id="load-catacombs" type="button">Catacombs</button>
        <button id="load-catacombs-crypts" type="button">
          Catacombs with crypts and rooms
        </button>
        <button id="load-catacombs-symmetric" type="button">
          Symmetric catacombs with crypts
        </button>
      </div>
    </details>
    <div class="view">
      <label for="add-kind">Add a step</label>
      <select id="add-kind"></select>
      <button id="add-step" type="button">Add</button>
      <button id="clear-steps" type="button">Remove all</button>
    </div>
    <div id="steps"></div>
    <p id="stats"></p>
    <div class="view">
      <label for="after">Show after step</label>
      <select id="after"></select>
      <label for="display">Display</label>
      <select id="display">
        <option value="simple">simple</option>
        <option value="roguelike">roguelike</option>
      </select>
      <button id="download" type="button">Download PNG</button>
      <button id="copy-code" type="button">Copy code</button>
    </div>
    <form id="overlays">
      <label
        >Mark clearing centers <input name="showClearings" type="checkbox"
      /></label>
      <label
        >Outline templates <input name="showTemplates" type="checkbox" checked
      /></label>
      <label>Mark tunnels <input name="showTunnels" type="checkbox" /></label>
      <label>Outline halls <input name="showHalls" type="checkbox" /></label>
      <label
        >Outline caverns <input name="showCaverns" type="checkbox"
      /></label>
      <label>Outline rooms <input name="showRooms" type="checkbox" /></label>
      <label
        >Outline cell blocks <input name="showBlocks" type="checkbox" checked
      /></label>
      <label
        >Outline sewer chambers, cisterns, mouths and outfalls
        <input name="showSewers" type="checkbox" checked
      /></label>
      <label
        >Outline catacomb segments, niches, chambers and crypts
        <input name="showCatacombs" type="checkbox" checked
      /></label>
      <label>Show room gaps <input name="showGaps" type="checkbox" /></label>
      <label>Mark maze start <input name="showStart" type="checkbox" /></label>
      <label
        >Mark junctions <input name="showJunctions" type="checkbox"
      /></label>
      <label>Show reserved <input name="showReserved" type="checkbox" /></label>
      <label>Mark road exits <input name="showExits" type="checkbox" /></label>
      <label>Show grown roads <input name="showGrown" type="checkbox" /></label>
      <label
        >Show crossing plans <input name="showPlans" type="checkbox"
      /></label>
      <label
        >Show walking distances <input name="showDistances" type="checkbox"
      /></label>
      <label
        >Measure between
        <select name="between">
          <option value="places">every place</option>
          <option value="rooms">rooms only</option>
        </select>
      </label>
      <label
        >Distance metric
        <select name="metric">
          <option value="euclidean">euclidean</option>
          <option value="chebyshev">chebyshev</option>
          <option value="manhattan">manhattan</option>
        </select>
      </label>
      <label
        >Distance costs (JSON by tile number)
        <input name="costs" type="text" placeholder='{"7": 10}'
      /></label>
    </form>
    <p id="distances"></p>
    <p id="room"></p>
    <canvas id="map"></canvas>
    <p id="error"></p>
    <pre id="failures"></pre>
    <details id="code">
      <summary>Code</summary>
      <pre></pre>
    </details>
    <h2>Template editor</h2>
    <p>
      Export the templates as JSON and paste them into the Templates field of a
      room step.
    </p>
    <section id="templates"></section>
    <script type="module" src="./steps.ts"></script>
  </body>
</html>
