<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Angstloch playground: steps</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>Angstloch playground</h1>
    <nav>
      <a href="./index.html">Maze</a><a href="./dungeon.html">Dungeon</a
      ><a href="./cave.html">Cave</a><a href="./mine.html">Mine</a
      ><a href="./noise.html">Noise</a><a href="./steps.html">Steps</a>
    </nav>
    <form id="controls">
      <label
        >Width <input name="width" type="number" value="80" min="3"
      /></label>
      <label
        >Height <input name="height" type="number" value="50" min="3"
      /></label>
      <label>Seed <input name="seed" type="number" value="1" /></label>
      <label
        >Tile size <input name="tileSize" type="number" value="12" min="1"
      /></label>
      <label
        >Base tile
        <select name="baseTile">
          <option value="3">grass</option>
          <option value="0">wall</option>
          <option value="1">floor</option>
        </select>
      </label>
      <label
        >Attempts <input name="attempts" type="number" value="3" min="1"
      /></label>
    </form>
    <div class="view">
      <label for="add-kind">Add a step</label>
      <select id="add-kind"></select>
      <button id="add-step" type="button">Add</button>
      <button id="load-forest" type="button">Load a forest</button>
      <button id="clear-steps" type="button">Remove all</button>
    </div>
    <div id="steps"></div>
    <p id="stats"></p>
    <div class="view">
      <label for="after">Show after step</label>
      <select id="after"></select>
      <label for="display">Display</label>
      <select id="display">
        <option value="simple">simple</option>
        <option value="roguelike">roguelike</option>
      </select>
      <button id="download" type="button">Download PNG</button>
    </div>
    <form id="overlays">
      <label
        >Mark clearing centers <input name="showClearings" type="checkbox"
      /></label>
      <label
        >Outline templates <input name="showTemplates" type="checkbox" checked
      /></label>
      <label
        >Mark junctions <input name="showJunctions" type="checkbox"
      /></label>
      <label>Mark road exits <input name="showExits" type="checkbox" /></label>
      <label>Show grown roads <input name="showGrown" type="checkbox" /></label>
      <label
        >Show crossing plans <input name="showPlans" type="checkbox"
      /></label>
    </form>
    <canvas id="map"></canvas>
    <p id="error"></p>
    <pre id="failures"></pre>
    <script type="module" src="./steps.ts"></script>
  </body>
</html>
