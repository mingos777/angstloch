<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Angstloch playground: forest</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>Angstloch playground</h1>
    <nav>
      <a href="./index.html">Maze</a><a href="./dungeon.html">Dungeon</a
      ><a href="./cave.html">Cave</a><a href="./mine.html">Mine</a
      ><a href="./forest.html">Forest</a><a href="./noise.html">Noise</a
      ><a href="./steps.html">Steps</a>
    </nav>
    <form id="controls">
      <label
        >Width <input name="width" type="number" value="80" min="1"
      /></label>
      <label
        >Height <input name="height" type="number" value="50" min="1"
      /></label>
      <label>Seed <input name="seed" type="number" value="1" /></label>
      <label
        >Tile size <input name="tileSize" type="number" value="12" min="1"
      /></label>
      <label
        >Min density
        <input
          name="minDensity"
          type="number"
          value="0"
          min="0"
          max="1"
          step="0.05"
      /></label>
      <label
        >Max density
        <input
          name="maxDensity"
          type="number"
          value="0.25"
          min="0"
          max="1"
          step="0.05"
      /></label>
      <label
        >Scale X
        <input name="scaleX" type="number" value="40" min="0.1" step="1"
      /></label>
      <label
        >Scale Y
        <input name="scaleY" type="number" value="40" min="0.1" step="1"
      /></label>
      <label
        >Rotation <input name="rotation" type="number" value="0" step="5"
      /></label>
      <label
        >Octaves <input name="octaves" type="number" value="1" min="1"
      /></label>
      <label
        >Persistence
        <input
          name="persistence"
          type="number"
          value="0.2"
          min="0"
          max="1"
          step="0.05"
      /></label>
      <label
        >Lacunarity
        <input name="lacunarity" type="number" value="1" min="0.1" step="0.1"
      /></label>
      <label>Road <input name="road" type="checkbox" /></label>
      <label
        >Road angle
        <input name="roadAngle" type="number" placeholder="random" step="5"
      /></label>
      <label
        >Road width min
        <input name="roadWidthMin" type="number" value="3" min="1"
      /></label>
      <label
        >Road width max
        <input name="roadWidthMax" type="number" value="3" min="1"
      /></label>
      <label
        >Road windiness
        <input
          name="roadWindiness"
          type="number"
          value="0.3"
          min="0"
          max="1"
          step="0.05"
      /></label>
      <label>Stream <input name="stream" type="checkbox" /></label>
      <label
        >Stream angle
        <input name="streamAngle" type="number" placeholder="random" step="5"
      /></label>
      <label>Spring <input name="spring" type="checkbox" /></label>
      <label
        >Bridges (at least)
        <input name="streamBridges" type="number" value="0" min="0"
      /></label>
      <label
        >Stream width min
        <input name="streamWidthMin" type="number" value="3" min="1"
      /></label>
      <label
        >Stream width max
        <input name="streamWidthMax" type="number" value="3" min="1"
      /></label>
      <label
        >Stream windiness
        <input
          name="streamWindiness"
          type="number"
          value="0.5"
          min="0"
          max="1"
          step="0.05"
      /></label>
      <label
        >Shore width <input name="shoreWidth" type="number" value="1" min="0"
      /></label>
      <label
        >Tributaries min
        <input name="tributariesMin" type="number" value="0" min="0"
      /></label>
      <label
        >Tributaries max
        <input name="tributariesMax" type="number" value="0" min="0"
      /></label>
      <label
        >Tributary width min
        <input name="tributaryWidthMin" type="number" value="1" min="1"
      /></label>
      <label
        >Tributary width max
        <input name="tributaryWidthMax" type="number" value="1" min="1"
      /></label>
      <label
        >Tributary angle min
        <input
          name="tributaryAngleMin"
          type="number"
          value="30"
          min="1"
          max="179"
      /></label>
      <label
        >Tributary angle max
        <input
          name="tributaryAngleMax"
          type="number"
          value="60"
          min="1"
          max="179"
      /></label>
      <label
        >Limit tributary length <input name="limitTributaries" type="checkbox"
      /></label>
      <label
        >Tributary length min
        <input name="tributaryLengthMin" type="number" value="10" min="1"
      /></label>
      <label
        >Tributary length max
        <input name="tributaryLengthMax" type="number" value="40" min="1"
      /></label>
      <label
        >Bank clearance
        <input name="bankClearance" type="number" value="0" min="0"
      /></label>
      <label
        >Bank falloff <input name="bankFalloff" type="number" value="0" min="0"
      /></label>
      <label
        >Bridge angle min
        <input name="bridgeAngleMin" type="number" value="75" min="1" max="179"
      /></label>
      <label
        >Bridge angle max
        <input name="bridgeAngleMax" type="number" value="90" min="1" max="179"
      /></label>
      <label
        >Clearance <input name="clearance" type="number" value="0" min="0"
      /></label>
      <label
        >Falloff <input name="falloff" type="number" value="0" min="0"
      /></label>
      <label
        >Distance
        <select name="distance">
          <option value="chebyshev">chebyshev</option>
          <option value="manhattan">manhattan</option>
          <option value="euclidean">euclidean</option>
        </select>
      </label>
      <label
        >Clearing spacing
        <input name="clearingSpacing" type="number" value="0" min="0"
      /></label>
      <button id="add-clearing" type="button">Add clearing</button>
      <div id="clearings"></div>
      <fieldset>
        <legend>Templates</legend>
        <label
          >Place templates <input name="useTemplates" type="checkbox"
        /></label>
        <label
          >Template
          <select name="templateKind">
            <option value="ruin">ruin</option>
            <option value="camp">camp</option>
            <option value="arena">arena</option>
          </select>
        </label>
        <label
          >Count min
          <input name="templateCountMin" type="number" value="1" min="0"
        /></label>
        <label
          >Count max
          <input name="templateCountMax" type="number" value="1" min="0"
        /></label>
        <label
          >Chance
          <input
            name="templateChance"
            type="number"
            value="1"
            min="0"
            max="1"
            step="0.05"
        /></label>
        <label
          >Needs a clearing
          <input name="templateClearing" type="checkbox" checked
        /></label>
        <label
          >Outline templates
          <input name="showTemplates" type="checkbox" checked
        /></label>
      </fieldset>
      <label
        >Crossings min
        <input name="crossingsMin" type="number" value="0" min="0"
      /></label>
      <label
        >Crossings max
        <input name="crossingsMax" type="number" value="0" min="0"
      /></label>
      <label
        >Crossing angle min
        <input
          name="crossingAngleMin"
          type="number"
          value="45"
          min="1"
          max="179"
      /></label>
      <label
        >Crossing angle max
        <input
          name="crossingAngleMax"
          type="number"
          value="90"
          min="1"
          max="179"
      /></label>
      <label
        >Branches min <input name="branchesMin" type="number" value="0" min="0"
      /></label>
      <label
        >Branches max <input name="branchesMax" type="number" value="0" min="0"
      /></label>
      <label
        >Branch width min
        <input name="branchWidthMin" type="number" value="1" min="1"
      /></label>
      <label
        >Branch width max
        <input name="branchWidthMax" type="number" value="1" min="1"
      /></label>
      <label
        >Branch angle min
        <input name="branchAngleMin" type="number" value="20" min="1" max="179"
      /></label>
      <label
        >Branch angle max
        <input name="branchAngleMax" type="number" value="70" min="1" max="179"
      /></label>
      <label
        >Limit branch length <input name="limitBranches" type="checkbox"
      /></label>
      <label
        >Branch length min
        <input name="branchLengthMin" type="number" value="10" min="1"
      /></label>
      <label
        >Branch length max
        <input name="branchLengthMax" type="number" value="40" min="1"
      /></label>
      <label>Exact roads <input name="exactRoads" type="checkbox" /></label>
      <label
        >Road specs (JSON, needs Road checked)
        <textarea name="roadSpecs" rows="8" spellcheck="false">
[
  { "origin": { "x": 40, "y": 30 }, "angle": 0, "width": 3 },
  { "parent": 0, "at": 0.3, "angle": 90 },
  { "kind": "branch", "parent": 1, "at": 0.7, "length": 20 },
  { "kind": "branch", "origin": { "x": 5, "y": 5 }, "to": { "x": 40, "y": 30 } }
]</textarea>
      </label>
      <label
        >Mark junctions <input name="showJunctions" type="checkbox" checked
      /></label>
      <label>Show grown roads <input name="showGrown" type="checkbox" /></label>
      <label
        >Show crossing plans <input name="showPlans" type="checkbox"
      /></label>
      <label
        >Mark road exits <input name="showExits" type="checkbox" checked
      /></label>
      <label
        >Tiles
        <select name="tiles">
          <option value="forest">grass and tree</option>
          <option value="plain">floor and wall</option>
        </select>
      </label>
    </form>
    <template id="clearing-row">
      <fieldset class="clearing">
        <label
          >At
          <select name="clearingAt">
            <option value="">position</option>
            <option value="branch-end">branch end</option>
            <option value="stream">stream</option>
          </select>
        </label>
        <label
          >x <input name="clearingX" type="number" value="40" min="0"
        /></label>
        <label
          >y <input name="clearingY" type="number" value="25" min="0"
        /></label>
        <label
          >Radius x min
          <input name="clearingRadiusXMin" type="number" value="4" min="1"
        /></label>
        <label
          >Radius x max
          <input name="clearingRadiusXMax" type="number" value="4" min="1"
        /></label>
        <label
          >Radius y min
          <input
            name="clearingRadiusYMin"
            type="number"
            min="1"
            placeholder="= x"
        /></label>
        <label
          >Radius y max
          <input
            name="clearingRadiusYMax"
            type="number"
            min="1"
            placeholder="= x"
        /></label>
        <label
          >Angle <input name="clearingAngle" type="number" value="0"
        /></label>
        <label
          >Irregularity
          <input
            name="clearingIrregularity"
            type="number"
            value="0.5"
            min="0"
            max="1"
            step="0.1"
        /></label>
        <label
          >Road distance min
          <input name="clearingRoadDistanceMin" type="number" value="8" min="0"
        /></label>
        <label
          >Road distance max
          <input
            name="clearingRoadDistanceMax"
            type="number"
            value="25"
            min="0"
        /></label>
        <label class="inline"
          >Path <input name="clearingPath" type="checkbox"
        /></label>
        <label
          >Path width
          <input name="clearingPathWidth" type="number" value="1" min="1"
        /></label>
        <label
          >Path windiness
          <input
            name="clearingPathWindiness"
            type="number"
            value="0.3"
            min="0"
            max="1"
            step="0.1"
        /></label>
        <button class="remove-clearing" type="button">Remove</button>
      </fieldset>
    </template>
    <p id="stats"></p>
    <div class="view">
      <label for="display">Display</label>
      <select id="display">
        <option value="simple">simple</option>
        <option value="roguelike">roguelike</option>
        <option value="density">density</option>
      </select>
      <button id="download" type="button">Download PNG</button>
    </div>
    <canvas id="map"></canvas>
    <p id="error"></p>
    <script type="module" src="./forest.ts"></script>
  </body>
</html>
