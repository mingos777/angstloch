<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Angstloch playground: forest</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>Angstloch playground</h1>
    <nav>
      <a href="./index.html">Maze</a><a href="./dungeon.html">Dungeon</a
      ><a href="./cave.html">Cave</a><a href="./forest.html">Forest</a
      ><a href="./noise.html">Noise</a>
    </nav>
    <form id="controls">
      <label
        >Width <input name="width" type="number" value="120" min="1"
      /></label>
      <label
        >Height <input name="height" type="number" value="70" min="1"
      /></label>
      <label>Seed <input name="seed" type="number" value="1" /></label>
      <label
        >Tile size <input name="tileSize" type="number" value="8" min="1"
      /></label>
      <label
        >Min density
        <input
          name="minDensity"
          type="number"
          value="0"
          min="0"
          max="1"
          step="0.05"
      /></label>
      <label
        >Max density
        <input
          name="maxDensity"
          type="number"
          value="0.25"
          min="0"
          max="1"
          step="0.05"
      /></label>
      <label
        >Scale X
        <input name="scaleX" type="number" value="40" min="0.1" step="1"
      /></label>
      <label
        >Scale Y
        <input name="scaleY" type="number" value="40" min="0.1" step="1"
      /></label>
      <label
        >Rotation <input name="rotation" type="number" value="0" step="5"
      /></label>
      <label
        >Octaves <input name="octaves" type="number" value="1" min="1"
      /></label>
      <label
        >Persistence
        <input
          name="persistence"
          type="number"
          value="0.2"
          min="0"
          max="1"
          step="0.05"
      /></label>
      <label
        >Lacunarity
        <input name="lacunarity" type="number" value="1" min="0.1" step="0.1"
      /></label>
      <label
        >Tiles
        <select name="tiles">
          <option value="forest">grass and tree</option>
          <option value="plain">floor and wall</option>
        </select>
      </label>
    </form>
    <p id="stats"></p>
    <div class="view">
      <label for="display">Display</label>
      <select id="display">
        <option value="simple">simple</option>
        <option value="roguelike">roguelike</option>
        <option value="density">density</option>
      </select>
      <button id="download" type="button">Download PNG</button>
    </div>
    <canvas id="map"></canvas>
    <p id="error"></p>
    <script type="module" src="./forest.ts"></script>
  </body>
</html>
