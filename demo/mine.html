<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Angstloch playground: mine</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>Angstloch playground</h1>
    <nav>
      <a href="./index.html">Maze</a><a href="./dungeon.html">Dungeon</a
      ><a href="./cave.html">Cave</a><a href="./mine.html">Mine</a
      ><a href="./forest.html">Forest</a><a href="./noise.html">Noise</a>
    </nav>
    <form id="controls">
      <label
        >Width <input name="width" type="number" value="80" min="1"
      /></label>
      <label
        >Height <input name="height" type="number" value="50" min="1"
      /></label>
      <label>Seed <input name="seed" type="number" value="1" /></label>
      <label
        >Tile size <input name="tileSize" type="number" value="12" min="1"
      /></label>
      <label
        >Layout
        <select name="layout">
          <option value="fishbone">fishbone</option>
          <option value="veins">veins</option>
          <option value="pillars">pillars</option>
          <option value="rings">rings</option>
        </select>
      </label>
      <label
        >Density
        <input
          name="density"
          type="number"
          placeholder="auto"
          min="0"
          max="1"
          step="0.01"
      /></label>
      <label
        >Shaft width min (fishbone)
        <input name="shaftWidthMin" type="number" value="2" min="1"
      /></label>
      <label
        >Shaft width max (fishbone)
        <input name="shaftWidthMax" type="number" value="3" min="1"
      /></label>
      <label
        >Shaft windiness (fishbone)
        <input
          name="shaftWindiness"
          type="number"
          value="0.1"
          min="0"
          max="1"
          step="0.05"
      /></label>
      <label
        >Angle (fishbone)
        <input name="angle" type="number" placeholder="random" step="5"
      /></label>
      <label
        >Adit width min (fishbone)
        <input name="aditWidthMin" type="number" value="1" min="1"
      /></label>
      <label
        >Adit width max (fishbone)
        <input name="aditWidthMax" type="number" value="2" min="1"
      /></label>
      <label
        >Adit windiness (fishbone)
        <input
          name="aditWindiness"
          type="number"
          value="0.4"
          min="0"
          max="1"
          step="0.05"
      /></label>
      <label
        >Adit length min (fishbone)
        <input name="aditLengthMin" type="number" value="15" min="1"
      /></label>
      <label
        >Adit length max (fishbone)
        <input name="aditLengthMax" type="number" value="50" min="1"
      /></label>
      <label
        >Branch angle min (fishbone)
        <input name="branchAngleMin" type="number" value="45" min="1" max="179"
      /></label>
      <label
        >Branch angle max (fishbone)
        <input name="branchAngleMax" type="number" value="90" min="1" max="179"
      /></label>
      <label
        >Loops (fishbone)
        <input name="loops" type="number" value="0" min="0" max="1" step="0.05"
      /></label>
      <label
        >Vein width min (veins, pillars, rings)
        <input name="veinWidthMin" type="number" value="1" min="1"
      /></label>
      <label
        >Vein width max (veins, pillars, rings)
        <input name="veinWidthMax" type="number" value="2" min="1"
      /></label>
      <label
        >Vein windiness (veins, pillars, rings)
        <input
          name="veinWindiness"
          type="number"
          value="0.5"
          min="0"
          max="1"
          step="0.05"
      /></label>
      <label
        >Vein spacing (veins)
        <input name="veinSpacing" type="number" value="16" min="3"
      /></label>
      <label
        >Rings min (rings)
        <input name="ringsMin" type="number" placeholder="auto" min="1"
      /></label>
      <label
        >Rings max (rings)
        <input name="ringsMax" type="number" placeholder="auto" min="1"
      /></label>
      <label
        >Ring shape (rings)
        <select name="ringShape">
          <option value="oval">oval</option>
          <option value="circle">circle</option>
        </select>
      </label>
      <label
        >Ring width min (rings)
        <input name="ringWidthMin" type="number" value="2" min="1"
      /></label>
      <label
        >Ring width max (rings)
        <input name="ringWidthMax" type="number" value="3" min="1"
      /></label>
      <label
        >Ring wobble (rings)
        <input
          name="ringWobble"
          type="number"
          value="0.5"
          min="0"
          max="1"
          step="0.05"
      /></label>
      <label
        >Spokes min (rings)
        <input name="spokesMin" type="number" value="1" min="0"
      /></label>
      <label
        >Spokes max (rings)
        <input name="spokesMax" type="number" value="3" min="0"
      /></label>
      <label
        >Halls min (pillars)
        <input name="hallsMin" type="number" value="2" min="1"
      /></label>
      <label
        >Halls max (pillars)
        <input name="hallsMax" type="number" value="4" min="1"
      /></label>
      <label
        >Hall veins min (pillars)
        <input name="hallVeinsMin" type="number" value="2" min="1"
      /></label>
      <label
        >Hall veins max (pillars)
        <input name="hallVeinsMax" type="number" value="4" min="1"
      /></label>
      <label
        >Hall size min (pillars)
        <input name="hallSizeMin" type="number" placeholder="auto" min="1"
      /></label>
      <label
        >Hall size max (pillars)
        <input name="hallSizeMax" type="number" placeholder="auto" min="1"
      /></label>
      <label
        >Hall entrances (pillars)
        <select name="hallEntrances">
          <option value="facing">facing</option>
          <option value="edge">edge</option>
        </select>
      </label>
      <label
        >Hall ragged (pillars)
        <input
          name="hallRagged"
          type="number"
          value="0.5"
          min="0"
          max="1"
          step="0.05"
      /></label>
      <label
        >Pillar size min (pillars)
        <input name="pillarSizeMin" type="number" value="2" min="1"
      /></label>
      <label
        >Pillar size max (pillars)
        <input name="pillarSizeMax" type="number" value="5" min="1"
      /></label>
      <label
        >Pillar spacing min (pillars)
        <input name="pillarSpacingMin" type="number" value="2" min="1"
      /></label>
      <label
        >Pillar spacing max (pillars)
        <input name="pillarSpacingMax" type="number" value="4" min="1"
      /></label>
      <label
        >Pillar ragged (pillars)
        <input
          name="pillarRagged"
          type="number"
          value="0.5"
          min="0"
          max="1"
          step="0.05"
      /></label>
      <label
        >Pillar jitter (pillars)
        <input
          name="pillarJitter"
          type="number"
          value="0.5"
          min="0"
          max="1"
          step="0.05"
      /></label>
      <label
        >Caverns min <input name="cavernsMin" type="number" value="0" min="0"
      /></label>
      <label
        >Caverns max <input name="cavernsMax" type="number" value="0" min="0"
      /></label>
      <label
        >Cavern size min
        <input name="cavernSizeMin" type="number" value="12" min="3"
      /></label>
      <label
        >Cavern size max
        <input name="cavernSizeMax" type="number" value="24" min="3"
      /></label>
      <label
        >Cavern fill
        <input
          name="cavernFill"
          type="number"
          value="0.45"
          min="0"
          max="1"
          step="0.05"
      /></label>
      <label
        >Room count min
        <input name="roomCountMin" type="number" value="0" min="0"
      /></label>
      <label
        >Room count max
        <input name="roomCountMax" type="number" value="0" min="0"
      /></label>
      <label
        >Room width min
        <input name="roomWidthMin" type="number" value="3" min="1"
      /></label>
      <label
        >Room width max
        <input name="roomWidthMax" type="number" value="7" min="1"
      /></label>
      <label
        >Room height min
        <input name="roomHeightMin" type="number" value="3" min="1"
      /></label>
      <label
        >Room height max
        <input name="roomHeightMax" type="number" value="7" min="1"
      /></label>
      <label
        >Size uniformity
        <input
          name="sizeUniformity"
          type="number"
          value="0"
          min="0"
          max="1"
          step="0.05"
      /></label>
      <label
        >Exits per room min
        <input name="exitsPerRoomMin" type="number" value="1" min="1"
      /></label>
      <label
        >Exits per room max
        <input name="exitsPerRoomMax" type="number" value="3" min="1"
      /></label>
      <label
        >Door chance
        <input
          name="doorChance"
          type="number"
          value="1"
          min="0"
          max="1"
          step="0.05"
      /></label>
      <label
        >Exits min <input name="minExits" type="number" value="0" min="0"
      /></label>
      <label
        >Exits max <input name="maxExits" type="number" value="0" min="0"
      /></label>
      <label
        >Mark tunnels <input name="showTunnels" type="checkbox" checked
      /></label>
      <label
        >Mark halls <input name="showHalls" type="checkbox" checked
      /></label>
      <label
        >Mark caverns <input name="showCaverns" type="checkbox" checked
      /></label>
      <label
        >Outline templates <input name="showTemplates" type="checkbox" checked
      /></label>
      <label>Use templates <input name="useTemplates" type="checkbox" /></label>
    </form>
    <p id="stats"></p>
    <div class="view">
      <label for="display">Display</label>
      <select id="display">
        <option value="simple">simple</option>
        <option value="roguelike">roguelike</option>
      </select>
      <button id="download" type="button">Download PNG</button>
    </div>
    <canvas id="map"></canvas>
    <p id="error"></p>
    <section id="templates"></section>
    <script type="module" src="./mine.ts"></script>
  </body>
</html>
