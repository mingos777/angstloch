<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Angstloch playground</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 1rem;
        background: #1b1b1f;
        color: #ddd;
      }
      form {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr));
        gap: 0.5rem;
        max-width: 60rem;
        margin-bottom: 1rem;
      }
      label {
        display: flex;
        flex-direction: column;
        font-size: 0.8rem;
      }
      canvas {
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <h1>Angstloch playground</h1>
    <form id="controls">
      <label
        >Width <input name="width" type="number" value="41" min="3"
      /></label>
      <label
        >Height <input name="height" type="number" value="25" min="3"
      /></label>
      <label>Seed <input name="seed" type="number" value="1" /></label>
      <label
        >Tile size <input name="tileSize" type="number" value="16" min="1"
      /></label>
      <label
        >Horizontal bias
        <input name="horizontalBias" type="number" value="0" min="0" step="0.5"
      /></label>
      <label
        >Vertical bias
        <input name="verticalBias" type="number" value="0" min="0" step="0.5"
      /></label>
      <label
        >Loop chance
        <input
          name="loopChance"
          type="number"
          value="0"
          min="0"
          max="1"
          step="0.05"
      /></label>
      <label
        >Fill
        <input name="fill" type="number" value="1" min="0" max="1" step="0.05"
      /></label>
      <label
        >Straight
        <input
          name="straight"
          type="number"
          value="0"
          min="0"
          max="1"
          step="0.05"
      /></label>
      <label
        >Symmetry
        <select name="symmetry">
          <option value="none">none</option>
          <option value="whirlpool">whirlpool</option>
          <option value="snowflake">snowflake</option>
        </select>
      </label>
      <label
        >Symmetry chance
        <input
          name="symmetryChance"
          type="number"
          value="1"
          min="0"
          max="1"
          step="0.05"
      /></label>
      <label
        >Exits <input name="exits" type="number" value="0" min="0"
      /></label>
    </form>
    <canvas id="map"></canvas>
    <p id="error"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
