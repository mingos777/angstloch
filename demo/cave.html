<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Angstloch playground: cave</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>Angstloch playground</h1>
    <nav>
      <a href="./index.html">Maze</a><a href="./dungeon.html">Dungeon</a
      ><a href="./cave.html">Cave</a><a href="./forest.html">Forest</a
      ><a href="./noise.html">Noise</a>
    </nav>
    <form id="controls">
      <label
        >Width <input name="width" type="number" value="61" min="1"
      /></label>
      <label
        >Height <input name="height" type="number" value="41" min="1"
      /></label>
      <label>Seed <input name="seed" type="number" value="1" /></label>
      <label
        >Tile size <input name="tileSize" type="number" value="12" min="1"
      /></label>
      <label
        >Generator
        <select name="generator">
          <option value="automaton">automaton</option>
          <option value="noise">noise</option>
        </select>
      </label>
      <label
        >Fill chance (automaton)
        <input
          name="fillChance"
          type="number"
          value="0.45"
          min="0"
          max="1"
          step="0.01"
      /></label>
      <label
        >Iterations (automaton)
        <input name="iterations" type="number" value="4" min="0"
      /></label>
      <label
        >Birth limit (automaton)
        <input name="birthLimit" type="number" placeholder="auto" min="0"
      /></label>
      <label
        >Survival limit (automaton)
        <input name="survivalLimit" type="number" placeholder="auto" min="0"
      /></label>
      <label
        >Neighborhood (automaton)
        <select name="neighborhood">
          <option value="moore">moore (8)</option>
          <option value="von-neumann">von-neumann (4)</option>
        </select>
      </label>
      <label
        >Shape (noise)
        <select name="shape">
          <option value="blobs">blobs</option>
          <option value="veins">veins</option>
        </select>
      </label>
      <label
        >Fill (noise)
        <input
          name="fill"
          type="number"
          value="0.45"
          min="0"
          max="1"
          step="0.01"
      /></label>
      <label
        >Corner bias (noise)
        <input name="cornerBias" type="number" value="4" min="0"
      /></label>
      <label
        >Scale X (noise)
        <input name="scaleX" type="number" value="12" min="0.1" step="0.5"
      /></label>
      <label
        >Scale Y (noise)
        <input name="scaleY" type="number" value="12" min="0.1" step="0.5"
      /></label>
      <label
        >Rotation (noise)
        <input name="rotation" type="number" value="0" step="5"
      /></label>
      <label
        >Octaves (noise) <input name="octaves" type="number" value="3" min="1"
      /></label>
      <label
        >Persistence (noise)
        <input
          name="persistence"
          type="number"
          value="0.5"
          min="0"
          max="1"
          step="0.05"
      /></label>
      <label
        >Lacunarity (noise)
        <input name="lacunarity" type="number" value="2" min="0.1" step="0.1"
      /></label>
      <label
        >Smoothing passes (noise)
        <input name="noiseIterations" type="number" value="0" min="0"
      /></label>
      <label
        >Min region size
        <input name="minRegionSize" type="number" value="0" min="0"
      /></label>
      <label
        >Connect
        <select name="connect">
          <option value="tunnel">tunnel</option>
          <option value="largest">largest</option>
          <option value="none">none</option>
        </select>
      </label>
      <label
        >Tunnel style
        <select name="tunnelStyle">
          <option value="winding">winding</option>
          <option value="direct">direct</option>
        </select>
      </label>
      <label
        >Tunnel width <input name="tunnelWidth" type="number" value="1" min="1"
      /></label>
      <label
        >Tunnel windiness
        <input
          name="tunnelWindiness"
          type="number"
          value="0.5"
          min="0"
          max="1"
          step="0.05"
      /></label>
      <label
        >Tunnel loops
        <input
          name="tunnelLoops"
          type="number"
          value="0"
          min="0"
          max="1"
          step="0.05"
      /></label>
      <label
        >Layout symmetry
        <select name="layoutSymmetry">
          <option value="none">none</option>
          <option value="horizontal">horizontal</option>
          <option value="vertical">vertical</option>
          <option value="both">both</option>
          <option value="rotational">rotational</option>
        </select>
      </label>
      <label
        >Layout symmetry chance
        <input
          name="layoutSymmetryChance"
          type="number"
          value="1"
          min="0"
          max="1"
          step="0.05"
      /></label>
      <label
        >Tunnel symmetry chance
        <input
          name="tunnelSymmetryChance"
          type="number"
          value="1"
          min="0"
          max="1"
          step="0.05"
      /></label>
      <label
        >Exits min <input name="minExits" type="number" value="0" min="0"
      /></label>
      <label
        >Exits max <input name="maxExits" type="number" value="0" min="0"
      /></label>
      <label
        >Mark region centers <input name="showCenters" type="checkbox" checked
      /></label>
      <label
        >Border walls <input name="borderWalls" type="checkbox" checked
      /></label>
    </form>
    <p id="stats"></p>
    <div class="view">
      <label for="display">Display</label>
      <select id="display">
        <option value="simple">simple</option>
        <option value="roguelike">roguelike</option>
      </select>
      <button id="download" type="button">Download PNG</button>
    </div>
    <canvas id="map"></canvas>
    <p id="error"></p>
    <script type="module" src="./cave.ts"></script>
  </body>
</html>
